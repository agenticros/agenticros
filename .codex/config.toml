[mcp_servers.agenticros]
command = "sh"
args = ["-c", "/usr/local/lib/corebrum/agenticros-with-ros.sh node /home/corebrum/agenticros/packages/agenticros-claude-code/dist/index.js 2>>/tmp/agenticros-mcp.log"]
enabled = true
startup_timeout_sec = 30

[mcp_servers.agenticros.env]
AGENTICROS_ROBOT_NAMESPACE = ""
[mcp_servers.agenticros.tools.ros2_list_topics]
approval_mode = "approve"

[mcp_servers.agenticros.tools.ros2_camera_snapshot]
approval_mode = "approve"

[mcp_servers.agenticros.tools.ros2_depth_distance]
approval_mode = "approve"
