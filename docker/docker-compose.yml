version: "3.8"

services:
  # ROS2 + rosbridge + Gazebo simulation
  ros2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: synapse/ros2:latest
    ports:
      - "9090:9090"   # rosbridge WebSocket
      - "11311:11311" # ROS master (if needed)
    environment:
      - ROS_DOMAIN_ID=0
      - GAZEBO_MODEL_PATH=/opt/ros/jazzy/share/turtlebot3_gazebo/models
      - TURTLEBOT3_MODEL=burger
    networks:
      - synapse

  # Corebrum Synapse plugin (runs within OpenClaw)
  synapse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.synapse
    image: synapse/plugin:latest
    environment:
      - SYNAPSE_TRANSPORT_MODE=rosbridge
      - SYNAPSE_ROSBRIDGE_URL=ws://ros2:9090
    depends_on:
      - ros2
    networks:
      - synapse

networks:
  synapse:
    driver: bridge
