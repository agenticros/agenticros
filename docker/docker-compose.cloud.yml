version: "3.8"

# Mode C: Cloud-side — OpenClaw + Corebrum Synapse plugin on a cloud VPS.
# Connects to the robot via WebRTC through the signaling server.

services:
  # Corebrum Synapse plugin (cloud-side, WebRTC transport)
  synapse:
    build:
      context: ..
      dockerfile: docker/Dockerfile.synapse
    image: synapse/plugin:latest
    environment:
      - SYNAPSE_TRANSPORT_MODE=webrtc
      - SYNAPSE_WEBRTC_SIGNALING_URL=wss://signaling-server:8443/ws
      - SYNAPSE_WEBRTC_API_URL=https://signaling-server:8443
      - SYNAPSE_WEBRTC_ROBOT_ID=${ROBOT_ID}
      - SYNAPSE_WEBRTC_ROBOT_KEY=${ROBOT_KEY}
    depends_on:
      - signaling-server
    networks:
      - synapse

  # WebRTC signaling server (existing webrtc-py FastAPI server)
  signaling-server:
    build:
      context: ../../webrtc-server/webrtc-py
      dockerfile: Dockerfile
    image: synapse/signaling:latest
    ports:
      - "8443:8443"
    environment:
      - ROBOT_TOKEN=${ROBOT_TOKEN}
    networks:
      - synapse

  # TURN relay server (optional — for networks where P2P fails)
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      - TURN_USERNAME=${TURN_USERNAME:-synapse}
      - TURN_PASSWORD=${TURN_PASSWORD:-synapse}
    networks:
      - synapse

networks:
  synapse:
    driver: bridge
